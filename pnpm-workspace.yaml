# Block installation of dependencies released less than 1 week ago (supply-chain hardening)
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - baseline-browser-mapping@2.11.30
  - browserslist@4.29.4
  - caniuse-lite@1.0.30001818
  - electron-to-chromium@1.5.463
  - node-releases@2.0.59
  - postcss@8.5.31

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  unrs-resolver: true

overrides:
  "@humanfs/node": 0.16.8
  vite: ^8.0.5
  picomatch: 4.0.4
  "@typescript-eslint/typescript-estree>minimatch": 9.0.7
  "brace-expansion@^1": "^5.0.9"
  brace-expansion: ^5.0.9
  ws: ^8.21.0
  immutable: ^5.1.8
  fast-uri: ^3.1.6
  js-yaml: ^4.3.1
  nanoid: ^3.3.18
  postcss: ^8.5.23
  browserslist: ^4.28.7

peerDependencyRules:
  allowedVersions:
    eslint: "10"
