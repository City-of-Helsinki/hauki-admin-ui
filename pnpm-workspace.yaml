# Block installation of dependencies released less than 1 week ago (supply-chain hardening)
minimumReleaseAge: 10080

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  unrs-resolver: true

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-jsx-a11y does not declare eslint 10 support yet
    eslint: "10"
